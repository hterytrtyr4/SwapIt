{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="container text-center">
    <div class="error-code">500</div>
    <h1 class="auth-title">Something went wrong</h1>
    <p class="auth-sub mx-auto" style="max-width: 460px;">An unexpected error occurred on our side. Please try again in a moment.</p>
    <a href="{{ url_for('marketplace.index') }}" class="btn btn-primary btn-lg px-4">
      <i class="bi bi-house me-2"></i>Back to home
    </a>
  </div>
</section>
{% endblock %}
