{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="container text-center">
    <div class="error-code">403</div>
    <h1 class="auth-title">Access denied</h1>
    <p class="auth-sub mx-auto" style="max-width: 460px;">You don't have permission to perform that action. You can only manage your own listings and requests.</p>
    <a href="{{ url_for('marketplace.index') }}" class="btn btn-primary btn-lg px-4">
      <i class="bi bi-house me-2"></i>Back to home
    </a>
  </div>
</section>
{% endblock %}
