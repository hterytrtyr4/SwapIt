{% extends 'base.html' %}

{% block title %}SwapIt - Don't Buy It. Swap It.{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="container text-center">
    <div class="error-code">{{ error_code }}</div>
    <h1 class="fw-bold mb-3">{{ title }}</h1>
    <p class="text-muted-2 mx-auto" style="max-width: 460px; line-height: 1.7;">{{ message }}</p>
    <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
      <a href="{{ url_for('marketplace.index') }}" class="btn btn-primary">
        <i class="bi bi-house me-2"></i>Back home
      </a>
      <a href="{{ url_for('marketplace.marketplace') }}" class="btn btn-outline-primary">
        <i class="bi bi-shop me-2"></i>Browse marketplace
      </a>
    </div>
  </div>
</div>
{% endblock %}
