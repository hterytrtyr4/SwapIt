{% extends 'base.html' %}

{% block title %}Log in - SwapIt{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <div class="auth-icon"><i class="bi bi-box-arrow-in-right"></i></div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-sub">Log in to continue swapping.</p>

          <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email"
                     required autofocus placeholder="you@example.com" value="{{ form_data.get('email', '') }}">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     required placeholder="Your password">
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember">Remember me on this device</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Log in
            </button>
          </form>

          <div class="auth-switch">
            New to SwapIt? <a href="{{ url_for('auth.register') }}">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
